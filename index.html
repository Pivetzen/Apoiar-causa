<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <!-- Bloqueio de Zoom e Escala de Ecrã -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo Cooperativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Jogo Cooperativo</h1>
      <div id="userInfo" class="user-info"></div>
    </header>

    <!-- Secção de Autenticação -->
    <section id="authSection" class="card">
      <div class="tabs">
        <button id="tabLoginBtn" class="active" onclick="switchTab('login')">Entrar</button>
        <button id="tabRegisterBtn" onclick="switchTab('register')">Cadastrar</button>
      </div>

      <!-- Formulário de Login -->
      <form id="loginForm">
        <h2>Acessar Conta</h2>
        <input type="text" id="loginUser" placeholder="Nome de Utilizador" required>
        <input type="password" id="loginPass" placeholder="Palavra-passe" required>
        <button type="submit">Entrar</button>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="registerForm" class="hidden">
        <h2>Novo Perfil</h2>
        <input type="text" id="regUser" placeholder="Nome de Utilizador" required>
        <input type="password" id="regPass" placeholder="Palavra-passe" required>
        <input type="text" id="regPix" placeholder="Chave PIX" required>
        <button type="submit">Registar</button>
      </form>
    </section>

    <!-- Dashboard do Jogo -->
    <section id="gameSection" class="card hidden">
      <div class="round-status">
        <h2>Rodada Atual: <span id="roundNumber">-</span></h2>
        <p>Progresso da Meta Coletiva</p>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <p><span id="currentPoints">0</span> / <span id="targetPoints">0</span> cliques</p>
      </div>

      <div class="action-area">
        <button id="clickBtn" onclick="iniciarRecompensa()">Pontuar (+1 Clique)</button>
        <p id="cooldownText" class="cooldown-msg"></p>
      </div>
    </section>

    <!-- Rodapé PIX -->
    <footer class="card pix-footer">
      <p>Apoie o projeto via PIX!</p>
      <div class="pix-box">
        <input type="text" id="pixKey" value="sua-chave-pix-aqui@email.com" readonly>
        <button onclick="copiarPix()">Copiar PIX</button>
      </div>
    </footer>
  </div>

  <!-- Modal do Anúncio de Recompensa -->
  <div id="adModal" class="modal hidden">
    <div class="modal-content">
      <h3>Anúncio de Recompensa</h3>
      <p>Aguarde o anúncio terminar para validar a sua pontuação...</p>
      <div class="timer-circle" id="adTimer">15</div>
      <button id="claimBtn" class="hidden" onclick="confirmarPontuacao()">Reclamar Ponto</button>
    </div>
  </div>

  <!-- iFrames ocultos para envio sem redirecionar -->
  <iframe name="hidden_iframe_reg" id="hidden_iframe_reg" style="display:none;"></iframe>
  <iframe name="hidden_iframe_clk" id="hidden_iframe_clk" style="display:none;"></iframe>

  <script src="script.js"></script>
</body>
</html>
